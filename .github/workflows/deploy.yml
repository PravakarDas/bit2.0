name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ssh config
        run: |
          if [[ ! -d ~/.ssh ]]; then
            mkdir ~/.ssh
          fi
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/access_key
          echo "Host git-server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/access_key
            IdentitiesOnly yes
            User git" > ~/.ssh/config
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/access_key
          chmod 600 ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH with a passphrase
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          echo "echo $SSH_PASSPHRASE" > ~/.ssh_askpass && chmod +x ~/.ssh_askpass
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | DISPLAY=None SSH_ASKPASS=~/.ssh_askpass ssh-add - >/dev/null

      - name: Build app image
        run: docker build -t bitcode-hrm:latest .

      - name: Build postgres image
        run: docker build -t bitcode-hrm-postgres:latest ./docker/postgres

      - name: Export images
        run: |
          docker save bitcode-hrm:latest bitcode-hrm-postgres:latest \
            | gzip > bitcode-hrm-images.tar.gz

      - name: Upload images to server
        run: |
          rsync -avz --progress -e "ssh -p ${{ secrets.SSH_PORT }}" \
            bitcode-hrm-images.tar.gz \
            git@${{ secrets.SSH_HOST }}:/tmp/bitcode-hrm-images.tar.gz

      - name: Deploy with Docker Compose
        run: |
          ssh -p ${{ secrets.SSH_PORT }} git@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            docker load < /tmp/bitcode-hrm-images.tar.gz
            docker compose down
            docker compose up -d --no-build
            rm /tmp/bitcode-hrm-images.tar.gz
            docker image prune -f
          EOF
