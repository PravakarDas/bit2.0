name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ssh config
        run: |
          if [[ ! -d ~/.ssh ]]; then
            mkdir ~/.ssh
          fi
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/access_key
          echo "Host git-server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/access_key
            IdentitiesOnly yes
            User git" > ~/.ssh/config
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/access_key
          chmod 600 ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH with a passphrase
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          echo "echo $SSH_PASSPHRASE" > ~/.ssh_askpass && chmod +x ~/.ssh_askpass
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | DISPLAY=None SSH_ASKPASS=~/.ssh_askpass ssh-add - >/dev/null

      - name: Build app image
        run: docker build -t bitcode-hrm:latest .

      - name: Build postgres image
        run: docker build -t bitcode-hrm-postgres:latest ./docker/postgres

      - name: Export images
        run: |
          docker save bitcode-hrm:latest bitcode-hrm-postgres:latest \
            | gzip > bitcode-hrm-images.tar.gz

      - name: Upload images to server
        run: |
          rsync -avz --progress -e "ssh -p ${{ secrets.SSH_PORT }}" \
            bitcode-hrm-images.tar.gz \
            git@${{ secrets.SSH_HOST }}:/tmp/bitcode-hrm-images.tar.gz

      - name: Deploy with Docker Compose
        run: |
          ssh -p ${{ secrets.SSH_PORT }} git@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            echo "--- disk usage before deploy ---"
            df -h /

            # Reclaim space from any dangling images left behind by a previous deploy BEFORE
            # attempting to load the new ones — not just after a successful run (see below).
            # `-f` alone only means "no tag and no container using it" — that is NOT the same
            # as "belongs to this app": on this shared VPS, another project's own dangling
            # image would satisfy that too. The label filter is the actual ownership check:
            # `app=bitcode-hrm` is baked into this project's own Dockerfiles (see Dockerfile
            # and docker/postgres/Dockerfile), independent of tag, so this can only ever match
            # an image THIS project built — never another app's, dangling or not, labeled or
            # unlabeled. (Images built before this label existed are simply skipped, not
            # touched — see this commit's message for that one-time transition note.)
            docker image prune -f --filter "label=app=bitcode-hrm"

            AVAIL_KB=$(df --output=avail / | tail -1)
            if [ "$AVAIL_KB" -lt 6291456 ]; then
              echo "WARNING: only ${AVAIL_KB}KB free on / after pruning — this deploy's images" \
                   "are several GB combined and may fail to load. Investigate disk usage" \
                   "(docker system df -v, df -h) before it fails mid-extraction with a less" \
                   "obvious containerd error." >&2
            fi

            docker load < /tmp/bitcode-hrm-images.tar.gz
            docker compose down
            docker compose up -d --no-build
            rm -f /tmp/bitcode-hrm-images.tar.gz
            # Reclaim space from the images just superseded by the load above — this is the
            # step that used to be the ONLY cleanup, and being last meant `set -euo pipefail`
            # skipped it entirely whenever an earlier command failed (e.g. docker load itself
            # running out of space), so a failed deploy left its dangling images behind
            # instead of freeing them for the next attempt. Kept here too for the normal
            # happy-path deploy, now backed up by the pre-load prune above. Same label filter,
            # same reason: ownership by label, not by "currently unused".
            docker image prune -f --filter "label=app=bitcode-hrm"

            echo "--- disk usage after deploy ---"
            df -h /
          EOF
